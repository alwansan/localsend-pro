name: LocalSend Pro Android diagnostics

on:
  push:
    branches:
      - feature/android-pro-fast-transfer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localsend-pro-android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  pro-unit:
    name: Pro policy tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze Pro code and live send/progress integration
        working-directory: app
        run: dart analyze lib/pro test/unit/pro lib/provider/network/send_provider.dart lib/pages/progress_page.dart lib/pages/device_details_page.dart
      - name: Test Pro route policy
        working-directory: app
        run: flutter test test/unit/pro

  pro-rust:
    name: Pro Rust transport checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust compiler with rustfmt
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Verify only Pro-touched Rust sources (baseline has unrelated format debt)
        run: |
          rustfmt +1.97.1 --edition 2021 --check \
            packages/core/src/http/pro.rs \
            packages/core/src/http/server/pro.rs \
            packages/core/src/http/client/v2.rs \
            packages/core/src/http/client/url.rs
      - name: Validate Pro native writer leases inside one Linux process
        run: cargo +1.97.1 test -p rust_lib_localsend_app --lib pro_file_lease
      - name: Test Rust HTTP core including Pro capabilities
        run: cargo +1.97.1 test -p localsend --features http --lib
      - name: Integration test pinned Pro handshake on real TLS server
        run: cargo +1.97.1 test -p localsend --features http --test v2_tls_pinning

  android-arm64-debug:
    name: Android ARM64 diagnostic APK (not final)
    needs: pro-unit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install pinned Rust compiler and Android target
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add aarch64-linux-android --toolchain 1.97.1
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Build diagnostic APK
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64
      - name: Verify APK and write artifact checksum
        working-directory: app/build/app/outputs/flutter-apk
        run: |
          test -s app-debug.apk
          sha256sum app-debug.apk > SHA256SUMS.txt
          printf 'Source commit: %s\nBranch: %s\nArtifact type: DIAGNOSTIC-DEBUG (NOT FINAL)\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > BUILD_INFO.txt
          cat SHA256SUMS.txt

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v6
        with:
          name: LocalSend-Pro-Android-arm64-DIAGNOSTIC
          path: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build/app/outputs/flutter-apk/SHA256SUMS.txt
            app/build/app/outputs/flutter-apk/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
