name: LocalSend Pro Android diagnostics

on:
  push:
    branches:
      - feature/android-pro-fast-transfer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localsend-pro-android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  pro-unit:
    name: Pro policy tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze Pro code
        working-directory: app
        run: dart analyze lib/pro test/unit/pro
      - name: Test Pro route policy
        working-directory: app
        run: flutter test test/unit/pro

  android-arm64-debug:
    name: Android ARM64 diagnostic APK (not final)
    needs: pro-unit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install pinned Rust compiler and Android target
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add aarch64-linux-android --toolchain 1.97.1
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Build diagnostic APK
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v6
        with:
          name: LocalSend-Pro-Android-arm64-DIAGNOSTIC
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
